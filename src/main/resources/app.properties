# Có thể ghi đè mọi giá trị bằng biến môi trường cùng tên viết hoa và thay dấu chấm bằng dấu gạch dưới.
app.baseUrl=http://localhost:8080/celine-closset-web
app.devMode=true

# Google OAuth 2.0 - tạo Web application credential trong Google Cloud Console.
google.clientId=
google.clientSecret=
google.redirectUri=http://localhost:8080/celine-closset-web/auth/google/callback

# ======================== QUÊN MẬT KHẨU KHÁCH HÀNG ========================
# Chức năng này CHỈ áp dụng cho vai trò CUSTOMER.
# Với Gmail: bật xác minh 2 bước rồi dùng App Password, không dùng mật khẩu Gmail thường.
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=celineclosset.reset@gmail.com
smtp.password=
# Để trống smtp.from thì hệ thống dùng chính smtp.username làm địa chỉ gửi.
smtp.from=celineclosset.reset@gmail.com
smtp.fromName=Celine Closet
smtp.startTls=true

# Token reset chỉ dùng được một lần và mặc định hết hạn sau 15 phút.
passwordReset.expirationMinutes=15
# auto = link reset tự theo localhost hoặc Cloudflare Tunnel mà khách đang truy cập.
# Có thể thay bằng URL cố định, ví dụ https://example.com/celine-closset-web
passwordReset.baseUrl=auto

# Thông tin hiển thị ở checkout/footer. Thay bằng dữ liệu thật của shop.
shop.hotline=0355122472
shop.email=hello@celineclosset.vn
shop.name=Celine Closet
shop.address=118/90/1 Liên Khu 5-6, Khu phố 33, Phường Bình Tân, TP.HCM, Việt Nam
# Có thể điền tọa độ chính xác; để trống thì backend sẽ geocode địa chỉ cửa hàng.
shop.latitude=10.8187500
shop.longitude=106.5963500
shop.facebook=https://www.facebook.com/
shop.instagram=https://www.instagram.com/
shop.tiktok=https://www.tiktok.com/
shop.youtube=https://www.youtube.com/
shop.bankName=TPBank
shop.bankCode=970423
# Điền số tài khoản và tên chủ tài khoản TPBank thật trước khi quét QR.
shop.bankAccount=10004575881
shop.bankOwner=NGUYEN LAM PHU KHANG
shop.qrImage=assets/images/payment/shop-qr-demo.png

# ======================== THANH TOÁN CHUYỂN KHOẢN ========================
# VietQR Quick Link tự điền số tiền và nội dung DH00001, DH00045..., không cần client id.
vietqr.quickLinkBase=https://img.vietqr.io/image
vietqr.template=compact2
payment.codePrefix=DH
payment.codeDigits=5
payment.expirationMinutes=10
payment.expirationCheckSeconds=30

# SePay webhook. Có thể ghi đè bằng SEPAY_WEBHOOK_API_KEY trên máy chủ.
sepay.webhookEnabled=true
sepay.webhookApiKey=CELINE_SEPAY_2026_K7mP9xQ4vN2sL8

# ======================== ĐỊA CHỈ & BẢN ĐỒ ========================
# Chỉ điền API key ở file này hoặc biến môi trường; không đưa key vào JSP/JavaScript.
# Geoapify: gợi ý địa chỉ và đổi điểm ghim thành địa chỉ.
geoapify.apiKey=
geoapify.autocompleteUrl=https://api.geoapify.com/v1/geocode/autocomplete
geoapify.reverseUrl=https://api.geoapify.com/v1/geocode/reverse

# LocationIQ: dịch vụ dự phòng khi Geoapify tạm lỗi/hết hạn mức.
locationiq.apiKey=
locationiq.searchUrl=https://us1.locationiq.com/v1/search
locationiq.reverseUrl=https://us1.locationiq.com/v1/reverse

# OpenRouteService: vẽ tuyến đường từ vị trí shipper đến điểm giao hàng.
openrouteservice.apiKey=
openrouteservice.directionsUrl=https://api.openrouteservice.org/v2/directions/driving-car/geojson
# Dự phòng khi ORS chưa có key hoặc tạm lỗi; route vẫn bám theo đường OpenStreetMap.
osrm.routeUrl=https://router.project-osrm.org/route/v1/driving/

# Nominatim không cần key, chỉ dùng dự phòng cuối cùng và gọi qua backend.
nominatim.searchUrl=https://nominatim.openstreetmap.org/search
nominatim.reverseUrl=https://nominatim.openstreetmap.org/reverse

# OpenRouter AI cho chatbox. Chỉ điền API key ở đây hoặc biến môi trường
# OPENROUTER_API_KEY; tuyệt đối không đưa key vào JSP/JavaScript.
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.apiKey=
openrouter.model=google/gemma-4-26b-a4b-it:free
openrouter.promptResource=chatbot/celine-chatbox-system-prompt.txt
openrouter.connectTimeoutSeconds=15
openrouter.requestTimeoutSeconds=60
openrouter.maxTokens=900
openrouter.temperature=0.25
openrouter.historyLimit=18

# Giữ khóa cũ để tương thích với các trang chưa nâng cấp.
chat.api.url=https://openrouter.ai/api/v1/chat/completions

# Tự xóa toàn bộ cuộc trò chuyện hỗ trợ sau thời gian không có tin nhắn mới.
support.chat.autoDeleteHours=48
support.chat.cleanupIntervalMinutes=60

# ======================== TRẢ HÀNG & HOÀN TIỀN ========================
# Khách được yêu cầu trả hàng trong 7 ngày kể từ lúc đơn hoàn thành.
return.requestDays=7
# Tài khoản ngân hàng nhận tiền chỉ được sửa trong 2 ngày đầu.
return.bankEditDays=2
# Giao diện thông báo hoàn tiền ngân hàng thường cần 3-4 ngày làm việc.
return.refundProcessingDays=4
